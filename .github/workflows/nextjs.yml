# Builds the Next.js site (web/) and publishes a ready-to-upload package:
# Actions › "Next.js paketi" › son çalıştırma › Artifacts › cetinkaya-web (deploy.zip).
name: Next.js paketi

on:
  push:
    paths: ['web/**', 'assets/**', '.github/workflows/nextjs.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: cetinkaya-web
          path: web/deploy
          include-hidden-files: true
          retention-days: 30
