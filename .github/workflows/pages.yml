# Builds the static site from Supabase content and publishes it to GitHub Pages.
# Setup: README › "Supabase ile yayın". Until SUPABASE_URL / SUPABASE_ANON_KEY are
# set (Settings › Secrets and variables › Actions), the docs/ demo preview is published.
name: Siteyi yayınla

on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]
  schedule:
    - cron: '7 * * * *' # hourly: scheduled blog posts + safety net

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pushes to other branches don't publish; schedule/dispatch always run on the default branch
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - name: Ayarları kontrol et
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL ve SUPABASE_ANON_KEY tanımlı değil; docs/ önizlemesi yayınlanıyor (README › Supabase ile yayın)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Until Supabase is configured, publish the static demo preview in docs/
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outputs.ready != 'true'
        with:
          path: docs

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: shivammathur/setup-php@v2
        if: steps.cfg.outputs.ready == 'true'
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, mbstring, dom, gd
          coverage: none

      - name: Siteyi derle
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if [ -z "$SITE_URL" ]; then
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            SITE_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          export SITE_URL
          php tools/build-site.php

      - uses: actions/configure-pages@v5
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
